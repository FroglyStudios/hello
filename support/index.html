<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | FroglyStudios</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header>
        <div class="container nav-container">
            <a href="/" class="logo">
                <img src="/assets/logo.png" alt="FroglyStudios" style="height: 52px; object-fit: contain;">
            </a>
            <nav class="nav-links">
                <a href="/#projects" data-i18n="nav.projects">Apps & Games</a>
                <a href="/support" data-i18n="nav.support">Support</a>
                <a href="/discord" data-i18n="nav.discord">Discord</a>
                <a href="#" id="lang-toggle" aria-label="Toggle Language" style="font-size: 1.2rem; margin-left: 1rem;"><i class="fa-solid fa-globe" id="lang-icon"></i></a>
            </nav>
        </div>
    </header>

    <main class="container fade-in" style="padding-top: 8rem; padding-bottom: 5rem; text-align: center;">
        <i class="fa-solid fa-life-ring" style="font-size: 4rem; color: var(--color-accent); margin-bottom: 1rem;"></i>
        <h1 data-i18n="support.title">Support</h1>
        <p data-i18n="support.desc" style="max-width: 600px; margin: 0 auto 2rem;">Need help? Join our Discord server or send us an email. We are here for you.</p>
        
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="/discord" class="btn btn-primary"><i class="fa-brands fa-discord"></i> Discord</a>
            <a href="mailto:froglystudios@gmail.com" class="btn btn-outline"><i class="fa-solid fa-envelope"></i> Email</a>
        </div>
    </main>

    <footer>
        <div class="container footer-content fade-in">
            <div class="logo" style="font-size: 1.2rem;">
                <img src="/assets/logo.png" alt="FroglyStudios" style="height: 36px; object-fit: contain;">
            </div>
            <div class="copyright">
                &copy; 2026 FroglyStudios. <span data-i18n="footer.rights">All rights reserved.</span>
            </div>
        </div>
    </footer>

    <script src="/js/i18n.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
